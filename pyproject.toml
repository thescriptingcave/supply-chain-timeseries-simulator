[project]
name = "supply-chain-timeseries-simulator"
version = "1.0.0"
description = "Stateful Supply Chain V3 simulator for historical and true-live time-series analytics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "psycopg2-binary>=2.9.9",
    "pytest>=9.1.1",
]

[dependency-groups]
notebook = [
    "duckdb>=1.1.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.52",
]
